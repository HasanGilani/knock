<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 452" width="860" height="452" role="img" aria-label="Terminal demo: knock indexes Flask in 461 ms, re-indexes in 30 ms, then answers a question with file and line references">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; white-space: pre; }
    .p { fill: #7ee787; } .c { fill: #e6edf3; } .o { fill: #8b949e; } .id { fill: #d2a8ff; }
    .cat { fill: #79c0ff; } .path { fill: #ffa657; } .ok { fill: #7ee787; } .hi { fill: #f2cc60; } .cm { fill: #6e7681; }
  </style>
  <rect x="0.5" y="0.5" width="859" height="451" rx="12" fill="#0d1117" stroke="#30363d"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="430" y="25" text-anchor="middle" class="o">~/code/flask</text>
  <line x1="0" y1="40" x2="860" y2="40" stroke="#21262d"/>

  <!-- master clock: everything restarts every 15 s -->
  <rect width="0" height="0"><animate id="t" attributeName="width" from="0" to="0" dur="15s" begin="0s;t.end"/></rect>

  <defs>
    <clipPath id="k1"><rect x="0" y="58" height="24" width="0"><set attributeName="width" to="0" begin="t.begin"/><animate attributeName="width" from="0" to="860" dur="0.8s" begin="t.begin+0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="k2"><rect x="0" y="142" height="24" width="0"><set attributeName="width" to="0" begin="t.begin"/><animate attributeName="width" from="0" to="860" dur="0.8s" begin="t.begin+2.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="k3"><rect x="0" y="202" height="24" width="0"><set attributeName="width" to="0" begin="t.begin"/><animate attributeName="width" from="0" to="860" dur="1.4s" begin="t.begin+4.4s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- 1. first index -->
  <text x="24" y="74" clip-path="url(#k1)"><tspan class="p">$ </tspan><tspan class="c">knock index .</tspan></text>
  <g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><set attributeName="opacity" to="1" begin="t.begin+1.5s"/>
    <text x="24" y="98" class="o">flask: completed in <tspan class="hi">461 ms</tspan> at 2c1b30d0503c</text>
    <text x="24" y="122" class="o">  files: 196 added · knowledge: 548 items · <tspan class="ok">0 model calls</tspan></text>
  </g>

  <!-- 2. re-index, nothing changed -->
  <text x="24" y="158" clip-path="url(#k2)"><tspan class="p">$ </tspan><tspan class="c">knock index .</tspan><tspan class="cm">   # again, nothing changed</tspan></text>
  <g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><set attributeName="opacity" to="1" begin="t.begin+3.6s"/>
    <text x="24" y="182" class="o">flask: completed in <tspan class="hi">30 ms</tspan> · 196 unchanged, <tspan class="ok">0 reprocessed</tspan></text>
  </g>

  <!-- 3. ask a question -->
  <text x="24" y="218" clip-path="url(#k3)"><tspan class="p">$ </tspan><tspan class="c">knock context "sessions signed with SECRET_KEY_FALLBACKS are rejected"</tspan></text>
  <g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><set attributeName="opacity" to="1" begin="t.begin+6.2s"/>
    <text x="24" y="246"><tspan class="id">k_5de6c6039b2d</tspan><tspan class="cat">  debugging </tspan><tspan class="c"> Fix commit fb54159861: secret key rotation: fix key list ordering</tspan></text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><set attributeName="opacity" to="1" begin="t.begin+6.7s"/>
    <text x="24" y="274" class="o">symbols:</text>
    <text x="24" y="298"><tspan class="path">  src/flask/sessions.py:317</tspan><tspan class="o">  method </tspan><tspan class="c">SecureCookieSessionInterface.get_signing_serializer</tspan></text>
    <text x="24" y="322"><tspan class="path">  tests/test_basic.py:374</tspan><tspan class="o">    function </tspan><tspan class="c">test_session_secret_key_fallbacks</tspan></text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><set attributeName="opacity" to="1" begin="t.begin+7.3s"/>
    <text x="24" y="350" class="o">files to inspect:</text>
    <text x="24" y="374" class="path">  src/flask/sessions.py</text>
  </g>
  <g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><set attributeName="opacity" to="1" begin="t.begin+7.9s"/>
    <text x="24" y="402"><tspan class="o">freshness: </tspan><tspan class="ok">fresh</tspan><tspan class="o">  (7,725 chars, instead of reading whole files)</tspan></text>
  </g>

  <!-- idle prompt with blinking cursor -->
  <g opacity="0"><set attributeName="opacity" to="0" begin="t.begin"/><set attributeName="opacity" to="1" begin="t.begin+8.6s"/>
    <text x="24" y="432"><tspan class="p">$ </tspan></text>
    <rect x="42" y="420" width="8" height="15" fill="#e6edf3"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
