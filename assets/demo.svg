<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="920" height="660" role="img" aria-label="Side by side: the same Saleor investigation in Claude Code without knock (30 tool calls, 3 min 22 s, $0.49) and with knock (13 tool calls, 1 min 16 s, $0.25). Real recorded sessions.">
