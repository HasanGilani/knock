[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "knock-mcp"
dynamic = ["version"]
description = "A code map and memory for AI coding agents like Claude Code, served over MCP. Runs locally, no API key."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Hasan Gilani" }]
keywords = ["mcp", "model-context-protocol", "claude-code", "ai-agents", "code-map", "code-intelligence", "knowledge-base", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=2.3,<3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
bench = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/HasanGilani/knock"
Repository = "https://github.com/HasanGilani/knock"
Benchmark = "https://github.com/HasanGilani/knock/blob/main/docs/benchmark.md"
Issues = "https://github.com/HasanGilani/knock/issues"

[project.scripts]
knock = "knock.cli:main"
# Same CLI under the package name, so `uvx knock-mcp ...` works without --from.
knock-mcp = "knock.cli:main"

[tool.setuptools.dynamic]
version = { attr = "knock.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
